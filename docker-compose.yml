# Desarrollo local con recarga en caliente: docker compose up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kollu-web
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
